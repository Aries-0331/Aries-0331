name: Update profile

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [bookmark-assistant-release]

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update README activity
        run: node scripts/update-profile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOS: HiAriesZhou/x-toc,HiAriesZhou/litecontext
          BOOKMARK_ASSISTANT_RELEASE_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          BLOG_FEED_URL: https://arieszhou.com/rss.en.xml
          POST_LIMIT: 3
          TITLE_MAX_LENGTH: 60

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/bookmark-assistant-release.json
          git diff --cached --quiet || git commit -m "Update profile activity"
          git push
